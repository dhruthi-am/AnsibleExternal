- name: Deploy to Tomcat
  hosts: web
  become: yes

  tasks:
    - name: Copy WAR file to Tomcat
      copy:
        src: "/var/snap/jenkins/5042/workspace/AnsibleExternal/target/AnsibleWebApp.war"
        dest: "/opt/tomcat/webapps/AnsibleWebApp.war"

    - name: Restart Tomcat
      shell: /opt/tomcat/bin/shutdown.sh && /opt/tomcat/bin/startup.sh
